name: wib_bakery
description: WIB Bakery Ordering System - Sistem pemesanan roti dan kue online.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Database SQLite
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Image & UI
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  carousel_slider: ^4.2.1

  # Utils
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  crypto: ^3.0.3
  uuid: ^4.4.2

  # Icons
  cupertino_icons: ^1.0.8
  flutter_iconly: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
